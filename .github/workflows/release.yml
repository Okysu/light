name: Release desktop apps

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  quality:
    name: Test release source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$PACKAGE_VERSION" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PACKAGE_VERSION"
            exit 1
          }

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  build:
    name: Build ${{ matrix.label }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            platform: macos-latest
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - label: macOS Intel
            platform: macos-latest
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
          - label: Linux x64
            platform: ubuntu-22.04
            rust_target: ''
            args: --bundles appimage,deb
          - label: Windows x64
            platform: windows-latest
            rust_target: ''
            # WiX/MSI only accepts numeric pre-release identifiers. NSIS keeps
            # the public tag and the in-app version exactly aligned (for example 0.0.1-rc).
            args: --bundles nsis

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile

      # Unix 的动态 fs scope 默认排除隐藏子目录；必须测试真正的 Rust matcher，
      # 仅检查 tauri.conf.json 或只在 Windows 上构建无法防止这个回归。
      - name: Test native filesystem scope
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --test workspace_scope

      - name: Read versioned release notes
        id: release-notes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';
          const version = process.env.GITHUB_REF_NAME;
          const path = `.github/release-notes/${version}.md`;
          const body = existsSync(path)
            ? readFileSync(path, 'utf8')
            : `Light ${version} desktop release.\n\nThese binaries are not code-signed yet.`;
          appendFileSync(process.env.GITHUB_OUTPUT, `body<<LIGHT_RELEASE_NOTES\n${body}\nLIGHT_RELEASE_NOTES\n`);
          NODE

      - name: Build and publish release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && '-' || '' }}
        with:
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: Light v${{ github.ref_name }}
          releaseBody: ${{ steps.release-notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generateReleaseNotes: true
          uploadWorkflowArtifacts: true
          releaseAssetNamePattern: '[name]_[version]_[platform]_[arch]_[bundle].[ext]'
          args: ${{ matrix.args }}
